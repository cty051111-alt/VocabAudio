name: Build VocabAudio Windows Beta
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**']
    tags: ['v2.1.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build and verify Windows package (offline OCR, UI, FFmpeg)
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: VocabAudio-2.1-Beta-Windows
          path: |
            dist/VocabAudio_2.1_Beta_Windows.zip
            dist/VocabAudio_2.1_Beta_Source.zip
            dist/*.sha256
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/tags/v2.1.0-beta'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VocabAudio-2.1-Beta-Windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-beta
          name: VocabAudio 2.1 Beta
          body_path: RELEASE_NOTES_v2.1.0-beta.md
          files: release/*
          prerelease: true
